spring:
  application:
    name: expenseflow
  datasource:
    url: jdbc:postgresql://localhost:5432/ems
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    # Kept open so lazy associations resolve during DTO mapping in controllers.
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
        # Any lazy association still touched one-row-at-a-time (e.g. mapping a single
        # mutated report back to a ReportResponse) loads in batches instead of N+1 queries.
        default_batch_fetch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8085

expenseflow:
  jwt:
    # Base64-encoded 256-bit secret. Override in production via ENV.
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZW1vLXNlY3JldC1rZXktMzIhIQ==}
    expiration-minutes: ${JWT_EXP_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
